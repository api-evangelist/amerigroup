name: Amerigroup
description: 'Amerigroup is a US health insurance company specializing in publicly funded
  health care, offering Medicaid managed care coverage to low-income families, children,
  pregnant women, seniors, and people with disabilities. It operates today as Amerigroup
  Community Care in Georgia and is part of Elevance Health (formerly WellPoint/Anthem),
  which acquired the company in 2012 and has since rebranded most Amerigroup plans to
  Wellpoint. Amerigroup coordinates benefits, provider networks, and care management
  for state Medicaid and related government health programs. Members and health-care
  providers interact through the amerigroup.com member site and a separate provider
  portal; the company exposes no public developer API surface.'
